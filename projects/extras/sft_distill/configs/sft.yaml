model: Qwen/Qwen2.5-0.5B
dataset: HuggingFaceH4/ultrachat_200k   # or allenai/tulu-3-sft-mixture
dataset_split: train_sft
max_train_samples: 20000
max_seq_length: 2048
use_lora: true          # true on a T4, false on A100/H100
lora_r: 16
learning_rate: 2.0e-5   # use ~2e-4 with LoRA
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
fp16: true              # T4; use bf16 on Ampere+
seed: 0
output_dir: checkpoints/sft
